[project]
name = "from-scratch-loop"
version = "0.1.0"
description = "Agent #13: hand-rolled tool-use agent loop over OpenAI Chat Completions with three file-system tools for codebase Q&A."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # workspace root: common.llm / common.pricing / mock helper
    "openai>=1.50",
    "pydantic>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
