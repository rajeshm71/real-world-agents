[project]
name = "fact-checker"
version = "0.1.0"
description = "Agent #16: fact-check speech / video / text against live web search using a local Ollama LLM and a multi-provider search chain (Tavily -> Brave -> DDG, auto-failover on rate-limit)."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",
    # Local LLM via Ollama's HTTP API. User is responsible for
    # `ollama pull llama3.1:8b`; the agent checks connectivity and
    # raises a clean error otherwise. Verified 0.6.2 on PyPI
    # 2026-08-28.
    "ollama>=0.6.2",
    # Search providers. All optional at runtime -- DDG requires no
    # key; Tavily/Brave gate themselves on env vars.
    "tavily-python>=0.8.0",
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "pydantic>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
