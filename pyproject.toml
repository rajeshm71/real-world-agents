[project]
name = "real-world-agents"
version = "0.1.0"
description = "Deployable AI agents for real-world use cases. Each agent demonstrates a different technique, structured to be easy to read and copy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajesh Mane", email = "rajeshmane711@gmail.com" }]
dependencies = [
    "openai>=1.50",
    "anthropic>=0.121",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

# NOTE: SPEC.md §3 requires [tool.uv.workspace] with agents/* as members.
# Deferred to F1.2 when the first agent (receipt extractor) is added --
# declaring a workspace with zero members is noise. When the first agent
# lands, add:
#   [tool.uv.workspace]
#   members = ["agents/*"]
# `common/` remains part of the root package rather than its own workspace
# member (simpler, avoids a redundant common/pyproject.toml duplicating
# the same deps).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind except) is not enforced: agents use broad `except Exception`
# deliberately for R5's "real error handling" (rate limits, malformed input,
# tool/API failure degrade gracefully rather than crashing the whole agent).
# Same policy as sibling rag-recipes project.
ignore = ["BLE001"]

[tool.pytest.ini_options]
testpaths = ["common/tests"]
