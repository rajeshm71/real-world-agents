[project]
name = "interview-prep"
version = "0.1.0"
description = "Adaptive mock-interview practice from a job description. Demonstrates a multi-turn, human-in-the-loop dialogue with conversation state threaded across separate agent invocations, via the OpenAI Agents SDK. Agent #12 of real-world-agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # for common.llm.resolve_model + common.llm.ollama_base_url
    # OpenAI Agents SDK: the whole point of this agent. Verified 0.20.0
    # installed 2026-09-05. Provider-agnostic via LiteLLM (documented as a
    # one-line swap in the README; not shipped in v1 to keep deps tight).
    "openai-agents>=0.20,<0.21",  # 0.21+ requires openai>=3.0 which conflicts with instructor's openai<3.0 cap (agents #01/#09)
    # OpenAI SDK: openai-agents transitively depends on it, but list
    # explicitly for the reader's benefit and pin discipline.
    "openai>=1.50",
    "pydantic>=2.5",
    "gradio>=4.44",  # UI; optional at CLI time.
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
