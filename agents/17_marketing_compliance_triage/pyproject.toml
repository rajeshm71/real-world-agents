[project]
name = "marketing-compliance-triage"
version = "0.1.0"
description = "Classify which regulatory lenses apply to draft marketing copy, then dispatch only the relevant specialist reviewers in parallel via a LangGraph conditional fan-out. Agent #17 of real-world-agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # for common.llm.get_llm + common.pricing.cost_usd
    # LangGraph is the whole point of this agent -- a classify node's
    # conditional edge returns a LIST of node names to fan out to 0-4
    # specialist reviewers in parallel, merged via an operator.add
    # reducer. Same pin as agent #03 (verified 1.2.10 on PyPI 2026-08-21,
    # stable 1.x API; this agent verified against the installed 1.2.11).
    "langgraph>=1.0",
    # Multi-provider by default (no single provider hardcoded): all three SDKs
    # listed explicitly; resolved lazily inside common.llm.get_llm().
    "openai>=1.50",
    "anthropic>=0.121",
    "google-genai>=1.0",
    "pydantic>=2.5",
    "gradio>=4.44",  # UI; optional at CLI time.
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
