[project]
name = "real-world-agents"
version = "0.1.0"
description = "Deployable AI agents for real-world use cases. Each agent demonstrates a different technique, structured to be easy to read and copy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rajesh Mane", email = "rajeshmane711@gmail.com" }]
dependencies = [
    "openai>=1.50",
    "anthropic>=0.121",
    "google-genai>=1.0",  # SPEC R6 bumped 3->4: multi-provider support (user request)
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

# uv workspace: agents/ are independent workspace members with their own
# pyproject.toml. `common/` stays as a subpackage of the root package (not
# its own workspace member) to avoid a redundant common/pyproject.toml
# duplicating deps. Agents that import from common/ do so via the root
# package via the `real-world-agents = { workspace = true }` source.
[tool.uv.workspace]
members = ["agents/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 (blind except) is not enforced: agents use broad `except Exception`
# deliberately for R5's "real error handling" (rate limits, malformed input,
# tool/API failure degrade gracefully rather than crashing the whole agent).
# Same policy as sibling rag-recipes project.
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
# Agent directories follow SPEC.md §8's NN_name convention (01_receipt_extractor,
# 02_contract_reviewer, etc.) — progressive-complexity ladder for readers.
# The digit prefix means the directory name isn't a valid Python identifier,
# so tests import via importlib. N999 is expected and intentional.
"agents/*/__init__.py" = ["N999"]
"agents/*/tests/__init__.py" = ["N999"]
"agents/*/tests/*.py" = ["N999"]

[tool.pytest.ini_options]
testpaths = ["common/tests", "agents", "tests"]
