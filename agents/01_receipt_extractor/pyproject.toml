[project]
name = "receipt-extractor"
version = "0.1.0"
description = "Receipt/invoice image -> structured JSON. Demonstrates structured extraction with Instructor + Claude vision. Agent #01 of real-world-agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # for common.pricing.cost_usd
    "instructor>=1.7",
    "anthropic>=0.121",
    "pydantic>=2.5",
    "gradio>=4.44",
    # F1.2 review S2: pypdf + pillow removed -- both were declared but never
    # imported. pillow comes in transitively via gradio when needed. pypdf
    # will be added back when PDF support is implemented (tracked in
    # tasks/todo.md as a prerequisite for F1.5 -- Anthropic supports PDFs
    # natively via `document` content blocks, so we may not need pypdf at
    # all; decision deferred to the F1.5 real-provider verification pass).
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
