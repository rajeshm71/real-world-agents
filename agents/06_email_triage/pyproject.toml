[project]
name = "email-triage"
version = "0.1.0"
description = "Type-safe email triage: a raw .eml -> a structured EmailTriage with category/priority/action/suggested reply. Demonstrates PydanticAI's typed Agent[Deps, Output] + dependency injection. Agent #06 of real-world-agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # for common.llm.resolve_model + common.pricing.cost_usd
    # PydanticAI is the whole point of this agent -- typed Agent + Deps.
    # Verified 2.33.0 on PyPI 2026-08-21 (WebSearch had listed 2.6.0
    # which was July 2026; latest stable at F6.1 time is 2.33.0). Pin
    # >=2.6 to allow 2.6-2.33 line without forcing a new major.
    "pydantic-ai>=2.6",
    # OpenAI SDK: pydantic-ai transitively supports many providers; we
    # list openai explicitly for the reader's benefit (default provider).
    "openai>=1.50",
    # dateutil: powers the extract_dates() tool. Standard, small.
    "python-dateutil>=2.9",
    "pydantic>=2.5",
    "gradio>=4.44",  # UI; optional at CLI time.
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
