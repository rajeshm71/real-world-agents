[project]
name = "receipt-extractor"
version = "0.1.0"
description = "Receipt/invoice image -> structured JSON. Demonstrates structured extraction with Instructor + Claude vision. Agent #01 of real-world-agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # for common.pricing.cost_usd
    "instructor>=1.7",
    "anthropic>=0.121",
    "pydantic>=2.5",
    "gradio>=4.44",
    "pillow>=10.4",
    "pypdf>=4.3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
