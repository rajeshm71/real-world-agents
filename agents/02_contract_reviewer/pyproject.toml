[project]
name = "contract-reviewer"
version = "0.1.0"
description = "Contract/NDA/MSA PDF -> flagged clauses + plain-English risk summary. Demonstrates long-context analysis with a hand-rolled JSON-validate-retry loop, no framework -- the pattern Instructor abstracts for you at agent #01. Agent #02 of real-world-agents."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # for common.llm.get_llm + common.pricing.cost_usd
    # Multi-provider by default (SPEC R6). All three SDKs listed explicitly so
    # a reader of this file alone sees the full picture of what agent #02 can
    # reach. openai/anthropic/google-genai are also root workspace deps
    # (transitively resolved via real-world-agents above).
    "openai>=1.50",
    "anthropic>=0.121",
    "google-genai>=1.0",
    "pydantic>=2.5",
    "pypdf>=5.0",  # PDF text extraction (per-page). Same lib the sibling rag-recipes uses.
    "gradio>=4.44",  # UI (agent.py + ui.py); optional at CLI time.
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
