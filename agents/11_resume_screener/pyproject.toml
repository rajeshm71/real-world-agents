[project]
name = "resume-screener"
version = "0.1.0"
description = "Agent #11: PydanticAI-driven resume screener. Given a JD and N resumes (pdf/docx/md/txt), returns per-candidate scorecards with evidence-cross-checked rationale and a ranked list."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "real-world-agents",  # workspace: common.llm / common.pricing / mock helper
    # PydanticAI provides typed structured outputs with native
    # function-calling under the hood. Same pin as #06 (verified 2.6-2.33
    # line; #11 tested against 2.31.1 at ship time).
    "pydantic-ai>=2.6",
    "openai>=1.50",
    # PDF extraction. pypdf 5.x is what #02 and #10 already use.
    "pypdf>=5.0",
    # python-docx is new to the catalog; verified 1.2.0 on PyPI
    # 2026-08-27. Small (~700 KB wheel), no compiled bits, cross-platform.
    "python-docx>=1.2.0",
    "pydantic>=2.5",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
real-world-agents = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
